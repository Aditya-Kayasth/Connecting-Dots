server:
  port: 8081

spring:
  application:
    name: core-service
    
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info

qstash:
  url: ${QSTASH_URL:https://qstash-us-east-1.upstash.io}
  token: ${QSTASH_TOKEN}
  api-url: "https://qstash-us-east-1.upstash.io/v2/publish/"
  ai-webhook-url: ${AI_WEBHOOK_URL}
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY}