server:
  port: ${PORT:8081}

spring:
  application:
    name: core-service
    
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/connecting_dots}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate           # Production: never auto-alter schema — Flyway owns migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false                # DISABLED: SQL logging is a security/performance risk in production

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false     # Allows fixing V1 schema without breaking existing Neon DB history

jwt:
  secret: ${JWT_SECRET}            # No fallback — JWT_SECRET must be set as a real secret in Render

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET} # No fallback — must be set in Render env group

logging:
  level:
    root: WARN
    com.connectingdots: INFO           # App-level logs only
    org.hibernate.SQL: OFF             # Disable SQL statement logging
    org.hibernate.type: OFF            # Disable SQL parameter logging
    org.springframework.web: WARN
    org.springframework.security: WARN

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    discovery:
      enabled: false

qstash:
  url: ${QSTASH_URL:https://qstash-us-east-1.upstash.io}
  token: ${QSTASH_TOKEN:}
  api-url: "https://qstash-us-east-1.upstash.io/v2/publish/"
  ai-webhook-url: ${AI_WEBHOOK_URL:}
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY:}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY:}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8082}