# ==============================================================================
# Test Configuration — Connecting Dots V2 Core Service
# Uses H2 in-memory DB (PostgreSQL mode) so tests never touch the live Neon DB.
# Flyway disabled in tests — Hibernate ddl-auto=create-drop builds schema from entities.
# spring.profiles.active=test suppresses the @Profile("dev") TestDatabaseSeeder.
# ==============================================================================

spring:
  profiles:
    active: test

  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]

  # H2 in-memory database — PostgreSQL compatibility mode
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop        # Hibernate creates schema from entities, drops after tests
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: false                 # Flyway skipped — Hibernate handles schema in test mode

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:test_cloud}
  api-key: ${CLOUDINARY_API_KEY:test_key}
  api-secret: ${CLOUDINARY_API_SECRET:test_secret}

jwt:
  secret: ${JWT_SECRET:test_jwt_secret_key_which_is_at_least_32_bytes_long_123456}

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:test_internal_secret}

qstash:
  token: ${QSTASH_TOKEN:test_token}
  api-url: "https://qstash-us-east-1.upstash.io/v2/publish/"
  ai-webhook-url: ${AI_WEBHOOK_URL:http://localhost:8082/api/v1/ai/webhook}
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY:test_signing_key}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY:test_signing_key}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
