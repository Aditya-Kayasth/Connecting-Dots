server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: core-service-route
              uri: lb://core-service
              predicates:
                - Path=/api/v1/core/**, /api/v1/auth/**
            - id: ai-service-route
              uri: lb://ai-service
              predicates:
                - Path=/api/v1/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/