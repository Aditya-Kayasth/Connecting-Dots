server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 15000
            response-timeout: 120s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                  - "https://connecting-dots-v2.vercel.app"
                  - "https://*.vercel.app"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
          # default-filters for rate limiting can be enabled when Redis is active
          routes:
            - id: core-service-route
              uri: ${CORE_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/core/**
            - id: auth-service-route
              uri: ${CORE_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: ai-service-route
              uri: ${AI_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/ai/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true