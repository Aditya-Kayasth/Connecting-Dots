server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  redis:
    url: ${REDIS_URL:}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 15000
        response-timeout: 120s
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "https://connecting-dots-v2.vercel.app"
              - "https://*.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: core-service-route
          uri: ${CORE_SERVICE_URL:https://core-service-9mpw.onrender.com}
          predicates:
            - Path=/api/v1/core/**
        - id: auth-service-route
          uri: ${CORE_SERVICE_URL:https://core-service-9mpw.onrender.com}
          predicates:
            - Path=/api/v1/auth/**
        - id: ai-service-route
          uri: ${AI_SERVICE_URL:https://ai-service-6r96.onrender.com}
          predicates:
            - Path=/api/v1/ai/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}