server:
  port: ${PORT:8082}

core:
  service:
    url: ${CORE_SERVICE_URL:http://localhost:8081}

spring:
  application:
    name: ai-service
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  data:
    redis:
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  model:
    chat: google-genai
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
        chat:
          options:
            model: gemini-3.5-flash

gemini:
  api:
    key: ${GEMINI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET:internal-service-secret}

qstash:
  current-signing-key: ${QSTASH_CURRENT_SIGNING_KEY:}
  next-signing-key: ${QSTASH_NEXT_SIGNING_KEY:}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true