# Render Blueprint Deployment Spec for Connecting Dots V2 Microservices
# Uses Render Environment Groups for 1-Click bulk .env upload

envVarGroups:
  - name: connecting-dots-secrets

services:
  # 1. Service Discovery (Eureka Server)
  - type: web
    name: eureka-server
    runtime: docker
    dockerfilePath: ./connecting-dots-backend/eureka-server/Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8761"

  # 2. Spring Cloud API Gateway
  - type: web
    name: gateway-service
    runtime: docker
    dockerfilePath: ./connecting-dots-backend/gateway-service/Dockerfile
    plan: free
    envVarGroups:
      - name: connecting-dots-secrets
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: REDIS_PORT
        value: "6379"

  # 3. Core Business & Database Service
  - type: web
    name: core-service
    runtime: docker
    dockerfilePath: ./connecting-dots-backend/core-service/Dockerfile
    plan: free
    envVarGroups:
      - name: connecting-dots-secrets
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: REDIS_PORT
        value: "6379"

  # 4. Gemini AI Ingestion Worker
  - type: web
    name: ai-service
    runtime: docker
    dockerfilePath: ./connecting-dots-backend/ai-service/Dockerfile
    plan: free
    envVarGroups:
      - name: connecting-dots-secrets
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://eureka-server:8761/eureka/
      - key: REDIS_PORT
        value: "6379"
