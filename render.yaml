# ==============================================================================
# CONNECTING DOTS V2 — RENDER BLUEPRINT (render.yaml)
# ------------------------------------------------------------------------------
# HOW TO USE:
#   1. Create an Environment Group named "connecting-dots-secrets" in the
#      Render dashboard (Environment Groups → New) and bulk-paste your real
#      secrets there (see .env.example for the full list of keys).
#   2. Commit & push this file to your repo root.
#   3. In Render: New → Blueprint → connect your repo → Apply.
#
# Service URLs are predictable based on the service name below.
# If any name is already taken on Render, update the downstream env var to match.
# ==============================================================================

services:

  # ─────────────────────────────────────────────────────────
  # 1. Service Discovery — Eureka Server (port 8761)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: connecting-dots-eureka-server
    runtime: docker
    plan: free
    dockerfilePath: connecting-dots-backend/eureka-server/Dockerfile
    dockerContext: connecting-dots-backend/eureka-server
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8761"
      - fromGroup: connecting-dots-secrets

  # ─────────────────────────────────────────────────────────
  # 2. API Gateway — Spring Cloud Gateway (port 8080)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: connecting-dots-gateway-service
    runtime: docker
    plan: free
    dockerfilePath: connecting-dots-backend/gateway-service/Dockerfile
    dockerContext: connecting-dots-backend/gateway-service
    envVars:
      - key: PORT
        value: "8080"
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://connecting-dots-eureka-server.onrender.com/eureka/
      - key: CORE_SERVICE_URL
        value: https://connecting-dots-core-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://connecting-dots-ai-service.onrender.com
      - fromGroup: connecting-dots-secrets

  # ─────────────────────────────────────────────────────────
  # 3. Core Business & Database Service (port 8081)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: connecting-dots-core-service
    runtime: docker
    plan: free
    dockerfilePath: connecting-dots-backend/core-service/Dockerfile
    dockerContext: connecting-dots-backend/core-service
    envVars:
      - key: PORT
        value: "8081"
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://connecting-dots-eureka-server.onrender.com/eureka/
      - key: CORE_SERVICE_URL
        value: https://connecting-dots-core-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://connecting-dots-ai-service.onrender.com
      - key: AI_WEBHOOK_URL
        value: https://connecting-dots-gateway-service.onrender.com/api/v1/ai/webhook
      - fromGroup: connecting-dots-secrets

  # ─────────────────────────────────────────────────────────
  # 4. AI Ingestion Worker — Gemini AI Service (port 8082)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: connecting-dots-ai-service
    runtime: docker
    plan: free
    dockerfilePath: connecting-dots-backend/ai-service/Dockerfile
    dockerContext: connecting-dots-backend/ai-service
    envVars:
      - key: PORT
        value: "8082"
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://connecting-dots-eureka-server.onrender.com/eureka/
      - key: CORE_SERVICE_URL
        value: https://connecting-dots-core-service.onrender.com
      - fromGroup: connecting-dots-secrets
