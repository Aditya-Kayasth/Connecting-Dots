server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ai-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ai/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: core-service-problems
          uri: lb://core-service
          predicates:
            - Path=/api/v1/problems/**
        - id: core-service-projects
          uri: lb://core-service
          predicates:
            - Path=/api/v1/projects/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
